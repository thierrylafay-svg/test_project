<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Démarche de test</title></head>
<body>
  <h1>Demande de changement d'adresse</h1>
  <form>
    <fieldset><legend>Nouvelle adresse</legend>
      <label>Numéro et rue <input type="text" required></label><br><br>
      <label>Ville <input type="text" required></label><br><br>
      <label>Pays
        <select>
          <option>France</option><option>Belgique</option><option>Suisse</option>
        </select>
      </label>
    </fieldset>
    <br>
    <button type="submit">Enregistrer le changement</button>
    <button type="button">Annuler la démarche</button>
  </form>
</body>
</html>
